name: KISA DEX checks
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kisa
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: kisa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kisa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kisa:test_only@localhost:5432/kisa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
